<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradeSphere — Global B2B Trade Prototype</title>
<style>
:root{--bg:#050b16;--panel:rgba(10,20,36,.88);--panel2:rgba(16,30,50,.9);--gold:#e9b949;--gold2:#fff0b5;--text:#f4f7fb;--muted:#a9b7c9;--line:rgba(255,255,255,.11);--green:#48d597;--red:#ff6b7a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg)}
body{overflow-x:hidden}
body:before,body:after{content:"";position:fixed;inset:-30%;pointer-events:none;z-index:-2}
body:before{background:
radial-gradient(circle at 20% 25%,rgba(20,100,190,.24),transparent 24%),
radial-gradient(circle at 80% 70%,rgba(231,178,62,.10),transparent 22%),
linear-gradient(rgba(50,110,170,.08) 1px,transparent 1px),
linear-gradient(90deg,rgba(50,110,170,.08) 1px,transparent 1px);background-size:auto,auto,58px 58px,58px 58px;transform:rotate(-5deg)}
body:after{background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.65) 78%);z-index:-1}
a{color:inherit}.hidden{display:none!important}
.topbar{height:74px;border-bottom:1px solid var(--line);background:rgba(4,10,20,.82);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.5px}.brand small{display:block;color:var(--muted);font-weight:500;font-size:10px;letter-spacing:1.8px}
.globe{width:46px;height:46px;border-radius:50%;position:relative;background:radial-gradient(circle at 34% 28%,#77d6ff 0 4%,#1778bd 20%,#06274c 68%,#020d1d);box-shadow:0 0 24px rgba(69,185,255,.35),inset -8px -7px 14px rgba(0,0,0,.55);overflow:visible}
.globe:before{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:repeating-linear-gradient(88deg,transparent 0 9px,rgba(255,255,255,.13) 10px 11px)}
.globe:after{content:"";position:absolute;inset:-6px -14px;border:1px solid rgba(233,185,73,.75);border-left-color:transparent;border-right-color:transparent;border-radius:50%;transform:rotate(-22deg);animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(338deg)}}
.nav{display:flex;gap:8px;align-items:center}.nav button,.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}.nav button:hover,.btn:hover{border-color:rgba(233,185,73,.55);background:rgba(233,185,73,.08)}
.btn.gold{background:linear-gradient(135deg,#f3ca68,#b47c19);color:#15100a;border:0}.btn.green{background:rgba(72,213,151,.12);border-color:rgba(72,213,151,.35);color:#a8f5d5}
.container{max-width:1180px;margin:auto;padding:34px 22px 70px}
.hero{padding:42px 0 28px;text-align:center}.eyebrow{color:var(--gold2);font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:800}
.hero h1{font-size:clamp(38px,6vw,72px);line-height:1;margin:13px 0;background:linear-gradient(90deg,#fff,#e9c76b,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:720px;margin:0 auto;color:var(--muted);font-size:17px;line-height:1.7}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:32px}.choice{padding:28px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(17,32,53,.88),rgba(6,14,27,.88));border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);cursor:pointer;transition:.2s}.choice:hover{transform:translateY(-3px);border-color:rgba(233,185,73,.45)}
.choice .icon{font-size:36px}.choice h2{margin:13px 0 7px}.choice p{color:var(--muted);line-height:1.6;margin:0}.choice .arrow{margin-top:22px;color:var(--gold);font-weight:800}
.section{margin-top:24px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 22px 70px rgba(0,0,0,.25)}.panel h2,.panel h3{margin-top:0}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.full{grid-column:1/-1}
label{display:block;font-size:12px;color:#c9d4e3;font-weight:800;margin:0 0 7px;letter-spacing:.2px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#071221;color:#fff;padding:12px 13px;outline:none;font:inherit}input:focus,select:focus,textarea:focus{border-color:rgba(233,185,73,.7);box-shadow:0 0 0 3px rgba(233,185,73,.08)}textarea{min-height:120px;resize:vertical}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(233,185,73,.12);color:var(--gold2);border:1px solid rgba(233,185,73,.22)}.badge.green{background:rgba(72,213,151,.1);border-color:rgba(72,213,151,.25);color:#a8f5d5}
.dashboard-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap}.stat{padding:15px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.stat b{font-size:24px;display:block;color:var(--gold2)}
.req{border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:12px;background:rgba(255,255,255,.025)}.req strong{font-size:17px}.req p{color:var(--muted);margin:7px 0;line-height:1.5}
.chat{height:340px;overflow:auto;background:#030914;border:1px solid var(--line);border-radius:14px;padding:14px}.bubble{max-width:78%;padding:10px 12px;border-radius:13px;margin:8px 0;line-height:1.45}.mine{margin-left:auto;background:rgba(233,185,73,.15);border:1px solid rgba(233,185,73,.2)}.theirs{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.note{padding:12px 14px;border-left:3px solid var(--gold);background:rgba(233,185,73,.06);color:#dce6f2;border-radius:8px;margin:12px 0}
.footer{border-top:1px solid var(--line);padding:30px 22px;color:var(--muted);text-align:center}.company{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:13px}.company span{padding:7px 10px;border:1px solid var(--line);border-radius:999px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}.modal-card{width:min(560px,100%);max-height:92vh;overflow:auto;background:#071321;border:1px solid rgba(233,185,73,.28);border-radius:20px;padding:24px;box-shadow:0 30px 100px rgba(0,0,0,.65)}.modal-card h2{margin-top:0}.close{float:right;border:0;background:transparent;color:#9caabd;font-size:24px;cursor:pointer}.lock{text-align:center;padding:28px 0 8px}.lock .big{font-size:54px}.success{border:1px solid rgba(72,213,151,.3);background:rgba(72,213,151,.08);padding:13px;border-radius:10px;color:#b8f8df}
@media(max-width:760px){.topbar{padding:0 15px}.nav button{display:none}.cards,.grid,.grid3{grid-template-columns:1fr}.container{padding:22px 14px 50px}.hero{padding-top:28px}.hero h1{font-size:43px}.topbar{height:64px}.brand small{display:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="globe" aria-label="Global logo"></div>
    <div><div id="brandName">TradeSphere</div><small>GLOBAL B2B TRADE</small></div>
  </div>
  <div class="nav">
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('dashboard')">Dashboard</button>
    <button id="profileBtn" onclick="showProfile()">Profile</button>
    <button id="logoutBtn" class="hidden" onclick="logout()">Logout</button>
  </div>
</header>

<main id="app" class="container"></main>

<footer class="footer">
  <div class="company">
    <span>Founder: Nikhil Pandey</span><span>CEO: Om Pandey</span><span>Director: Naman Pandey</span>
    <span>Email: Tradesphere@logistic.com</span><span>Mobile: Coming soon</span>
  </div>
  <p style="margin-bottom:0">Prototype only • Real OTP, server security and live matching require a backend.</p>
</footer>

<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>

<script>
const BRAND = "TradeSphere";
const SUPPORT_MOBILE = ""; // reserved for future company mobile number
const COUNTRIES = ["Afghanistan", "Albania", "Algeria", "Andorra", "Angola", "Antigua and Barbuda", "Argentina", "Armenia", "Australia", "Austria", "Azerbaijan", "Bahamas", "Bahrain", "Bangladesh", "Barbados", "Belarus", "Belgium", "Belize", "Benin", "Bhutan", "Bolivia", "Bosnia and Herzegovina", "Botswana", "Brazil", "Brunei", "Bulgaria", "Burkina Faso", "Burundi", "Cabo Verde", "Cambodia", "Cameroon", "Canada", "Central African Republic", "Chad", "Chile", "China", "Colombia", "Comoros", "Congo", "Costa Rica", "Côte d'Ivoire", "Croatia", "Cuba", "Cyprus", "Czechia", "Democratic Republic of the Congo", "Denmark", "Djibouti", "Dominica", "Dominican Republic", "Ecuador", "Egypt", "El Salvador", "Equatorial Guinea", "Eritrea", "Estonia", "Eswatini", "Ethiopia", "Fiji", "Finland", "France", "Gabon", "Gambia", "Georgia", "Germany", "Ghana", "Greece", "Grenada", "Guatemala", "Guinea", "Guinea-Bissau", "Guyana", "Haiti", "Honduras", "Hungary", "Iceland", "India", "Indonesia", "Iran", "Iraq", "Ireland", "Israel", "Italy", "Jamaica", "Japan", "Jordan", "Kazakhstan", "Kenya", "Kiribati", "Kuwait", "Kyrgyzstan", "Laos", "Latvia", "Lebanon", "Lesotho", "Liberia", "Libya", "Liechtenstein", "Lithuania", "Luxembourg", "Madagascar", "Malawi", "Malaysia", "Maldives", "Mali", "Malta", "Marshall Islands", "Mauritania", "Mauritius", "Mexico", "Micronesia", "Moldova", "Monaco", "Mongolia", "Montenegro", "Morocco", "Mozambique", "Myanmar", "Namibia", "Nauru", "Nepal", "Netherlands", "New Zealand", "Nicaragua", "Niger", "Nigeria", "North Korea", "North Macedonia", "Norway", "Oman", "Pakistan", "Palau", "Palestine", "Panama", "Papua New Guinea", "Paraguay", "Peru", "Philippines", "Poland", "Portugal", "Qatar", "Romania", "Russia", "Rwanda", "Saint Kitts and Nevis", "Saint Lucia", "Saint Vincent and the Grenadines", "Samoa", "San Marino", "Sao Tome and Principe", "Saudi Arabia", "Senegal", "Serbia", "Seychelles", "Sierra Leone", "Singapore", "Slovakia", "Slovenia", "Solomon Islands", "Somalia", "South Africa", "South Korea", "South Sudan", "Spain", "Sri Lanka", "Sudan", "Suriname", "Sweden", "Switzerland", "Syria", "Taiwan", "Tajikistan", "Tanzania", "Thailand", "Timor-Leste", "Togo", "Tonga", "Trinidad and Tobago", "Tunisia", "Türkiye", "Turkmenistan", "Tuvalu", "Uganda", "Ukraine", "United Arab Emirates", "United Kingdom", "United States", "Uruguay", "Uzbekistan", "Vanuatu", "Vatican City", "Venezuela", "Vietnam", "Yemen", "Zambia", "Zimbabwe"];
const ANY_COUNTRY = "Any Country";

let state = {
  page:"home",
  mode:"EXPORT",
  profile:null,
  requirements:[],
  messages:[],
  dealReady:{},
  audit:[]
};

function safeLoad(){
  try{
    const raw=localStorage.getItem("tradesphere_v1");
    if(raw) state=Object.assign(state,JSON.parse(raw));
  }catch(e){ console.warn("Storage unavailable",e); }
  if(!Array.isArray(state.requirements)) state.requirements=[];
  if(!Array.isArray(state.messages)) state.messages=[];
  if(!state.dealReady) state.dealReady={};
  if(!Array.isArray(state.audit)) state.audit=[];
}
function save(){
  try{ localStorage.setItem("tradesphere_v1",JSON.stringify(state)); }
  catch(e){ console.warn("Could not save local demo data",e); }
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function id(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);}
function logged(){return !!state.profile;}
function audit(action,extra={}){
  state.audit.push({id:id(),action,at:new Date().toISOString(),...extra});
  if(state.audit.length>500) state.audit=state.audit.slice(-500);
}
function countryList(idName,value=""){
  return `<input list="${idName}-list" id="${idName}" value="${esc(value)}" placeholder="Type or search country..." autocomplete="off">
  <datalist id="${idName}-list"><option value="${ANY_COUNTRY}"></option>${COUNTRIES.map(c=>`<option value="${esc(c)}"></option>`).join("")}</datalist>`;
}
function showPage(page){
  if(!logged()){openRegister();return;}
  state.page=page; render();
}
function render(){
  const app=document.getElementById("app");
  document.getElementById("logoutBtn").classList.toggle("hidden",!logged());
  if(!logged()){ renderPublic(); return; }
  if(state.page==="dashboard") renderDashboard();
  else if(state.page==="trade") renderTrade();
  else if(state.page==="chat") renderChat();
  else if(state.page==="profile") renderProfile();
  else renderHome();
}
function renderPublic(){
  document.getElementById("app").innerHTML=`
  <section class="hero">
    <div class="eyebrow">Global B2B Import • Export • Negotiation</div>
    <h1>Trade without borders.</h1>
    <p>One place to publish what you want to export, find what you want to import, negotiate privately and move to a mutual deal-ready stage.</p>
    <div class="actions" style="justify-content:center"><button class="btn gold" onclick="openRegister()">Register to Enter</button></div>
  </section>
  <section class="panel lock">
    <div class="big">🔐</div><h2>Registration is mandatory</h2>
    <p class="muted">No Export, Import, Dashboard or negotiation feature opens before registration.</p>
  </section>`;
}
function renderHome(){
  document.getElementById("app").innerHTML=`
  <section class="hero">
    <div class="eyebrow">Welcome, ${esc(state.profile.name)}</div>
    <h1>Global trade, privately.</h1>
    <p>Choose your trade intent. Your personal contact number stays hidden from other parties in this prototype.</p>
  </section>
  <section class="cards">
    <div class="choice" onclick="startTrade('EXPORT')"><div class="icon">🌍↗</div><h2>I WANT TO EXPORT</h2><p>I have a product and want to sell/export it to a buyer in any country.</p><div class="arrow">Start Export Requirement →</div></div>
    <div class="choice" onclick="startTrade('IMPORT')"><div class="icon">🌎↙</div><h2>I WANT TO IMPORT</h2><p>I need a product and want to source/buy/import it from any country.</p><div class="arrow">Start Import Requirement →</div></div>
  </section>
  <section class="section grid3">
    <div class="stat"><b>${state.requirements.length}</b>Saved requirements</div>
    <div class="stat"><b>${state.messages.length}</b>Chat messages</div>
    <div class="stat"><b>${Object.keys(state.dealReady).length}</b>Deal records</div>
  </section>
  <section class="section panel">
    <h3>Privacy by design</h3>
    <p class="muted">No photo upload, location sharing, file upload, voice/video or public contact numbers are included in V1. Trade information is the focus.</p>
  </section>`;
}
function startTrade(mode){ state.mode=mode; state.page="trade"; render(); }
function renderTrade(){
  const mode=state.mode;
  document.getElementById("app").innerHTML=`
  <div class="dashboard-head"><div><span class="badge">${mode==="EXPORT"?"EXPORT":"IMPORT"}</span><h1>${mode==="EXPORT"?"I WANT TO EXPORT":"I WANT TO IMPORT"}</h1><p class="muted">${mode==="EXPORT"?"Tell buyers what you can supply.":"Tell suppliers what you need."}</p></div><button class="btn" onclick="showPage('home')">← Back</button></div>
  <section class="panel">
    <div class="grid">
      <div><label>Product / Commodity *</label><input id="product" placeholder="e.g. Basmati Rice, Cumin, Machinery"></div>
      <div><label>Target / Source Country *</label>${countryList("tradeCountry",ANY_COUNTRY)}</div>
      <div><label>Quantity *</label><input id="quantity" placeholder="e.g. 10 MT / 500 cartons"></div>
      <div><label>Price</label><input id="price" placeholder="e.g. USD 950/MT or Negotiable"></div>
      <div class="full"><label>Detailed trade requirements *</label><textarea id="details" placeholder="Quality/specification, packing, Incoterm, destination/origin port, documents, payment preference, timeline, certifications, etc."></textarea></div>
    </div>
    <div class="note">Only relevant trade information is intended to be shared. Personal mobile number and personal address are not shown to a match.</div>
    <div class="actions"><button class="btn gold" onclick="publishRequirement()">Publish Requirement</button><button class="btn" onclick="showPage('dashboard')">View My Dashboard</button></div>
  </section>`;
}
function publishRequirement(){
  const product=document.getElementById("product").value.trim();
  const country=document.getElementById("tradeCountry").value.trim()||ANY_COUNTRY;
  const quantity=document.getElementById("quantity").value.trim();
  const price=document.getElementById("price").value.trim();
  const details=document.getElementById("details").value.trim();
  if(!product||!quantity||!details){alert("Please fill Product, Quantity and Detailed trade requirements.");return;}
  const req={id:id(),mode:state.mode,product,country,quantity,price,details,owner:state.profile.id,status:"OPEN",createdAt:new Date().toISOString()};
  state.requirements.push(req);audit("REQUIREMENT_CREATED",{requirementId:req.id,mode:req.mode,product:req.product,country:req.country});save();
  state.page="dashboard";render();
}
function renderDashboard(){
  const mine=state.requirements.filter(r=>r.owner===state.profile.id);
  const others=state.requirements.filter(r=>r.owner!==state.profile.id);
  document.getElementById("app").innerHTML=`
  <div class="dashboard-head"><div><div class="eyebrow">Private trade workspace</div><h1>Dashboard</h1><p class="muted">Your number and personal address remain hidden.</p></div><div class="actions"><button class="btn gold" onclick="startTrade('EXPORT')">+ Export</button><button class="btn gold" onclick="startTrade('IMPORT')">+ Import</button></div></div>
  <section class="section grid3"><div class="stat"><b>${mine.length}</b>My requirements</div><div class="stat"><b>${others.length}</b>Other demo requirements</div><div class="stat"><b>${state.messages.filter(m=>m.from===state.profile.id).length}</b>My messages</div></section>
  <section class="section panel"><h2>My Requirements</h2>${mine.length?mine.map(reqCard).join(""):'<p class="muted">No requirement yet.</p>'}</section>
  <section class="section panel"><h2>Potential Matches <span class="badge">DEMO MATCHING</span></h2><p class="muted">In this offline prototype, requirements are visible as demo matches. A production system would perform server-side matching and authorization.</p>${others.length?others.map(reqCard).join(""):'<p class="muted">No other demo requirements yet.</p>'}</section>`;
}
function reqCard(r){
  const same = r.owner===state.profile.id;
  return `<div class="req"><div class="row"><span class="badge">${esc(r.mode)}</span><span class="badge">${esc(r.country)}</span>${same?'<span class="badge green">MY REQUIREMENT</span>':''}</div>
  <strong>${esc(r.product)}</strong><p><b>Quantity:</b> ${esc(r.quantity)} ${r.price?` • <b>Price:</b> ${esc(r.price)}`:""}</p><p>${esc(r.details)}</p>
  <div class="actions">${!same?`<button class="btn gold" onclick="openChat('${r.id}')">Negotiate privately</button>`:`<button class="btn" onclick="openChat('${r.id}')">Open negotiation</button>`}</div></div>`;
}
function openChat(reqId){
  const req=state.requirements.find(r=>r.id===reqId);if(!req)return;
  state.activeReq=reqId;state.page="chat";render();
}
function renderChat(){
  const req=state.requirements.find(r=>r.id===state.activeReq);if(!req){showPage("dashboard");return;}
  const msgs=state.messages.filter(m=>m.reqId===req.id);
  const key=req.id;
  const ready=state.dealReady[key]||{mine:false,theirs:false};
  document.getElementById("app").innerHTML=`
  <div class="dashboard-head"><div><span class="badge">${esc(req.mode)}</span><h1>Private Negotiation</h1><p class="muted">${esc(req.product)} • ${esc(req.country)}</p></div><button class="btn" onclick="showPage('dashboard')">← Back</button></div>
  <section class="panel">
    <div class="note">🔒 Contact numbers, personal addresses and other private profile data are not displayed here. Chat is text-only: no photos, files, location, voice or video.</div>
    <div class="chat" id="chatBox">${msgs.length?msgs.map(m=>`<div class="bubble ${m.from===state.profile.id?"mine":"theirs"}"><div>${esc(m.text)}</div><small class="muted">${m.from===state.profile.id?"You":"Other party"}</small></div>`).join(""):'<p class="muted">Start the negotiation with a work-related message.</p>'}</div>
    <div class="actions"><input id="chatText" style="flex:1;min-width:220px" placeholder="Write only trade-related information..." onkeydown="if(event.key==='Enter')sendMessage('${req.id}')"><button class="btn gold" onclick="sendMessage('${req.id}')">Send</button></div>
  </section>
  <section class="section panel"><h2>Deal-ready stage</h2><p class="muted">This is separate from normal chat. Mark only when you genuinely want to proceed to the deal discussion.</p>
    <div class="row"><span class="badge ${ready.mine?'green':''}">${ready.mine?'✓ You are ready':'You are not ready'}</span><span class="badge ${ready.theirs?'green':''}">${ready.theirs?'✓ Other party ready':'Waiting for other party'}</span></div>
    <div class="actions"><button class="btn green" onclick="markReady('${req.id}')">WE ARE READY TO DEAL</button></div>
    ${ready.mine&&ready.theirs?'<div class="success" style="margin-top:12px">Mutual deal-ready status confirmed. Next step in production would be controlled deal-room creation.</div>':''}
  </section>`;
  setTimeout(()=>{const b=document.getElementById("chatBox");if(b)b.scrollTop=b.scrollHeight},0);
}
function sendMessage(reqId){
  const input=document.getElementById("chatText");const text=input.value.trim();if(!text)return;
  const msg={id:id(),reqId,from:state.profile.id,text,at:new Date().toISOString()};
  state.messages.push(msg);audit("MESSAGE_SENT",{requirementId:reqId,messageId:msg.id});save();render();
}
function markReady(reqId){
  if(!state.dealReady[reqId])state.dealReady[reqId]={mine:false,theirs:false};
  state.dealReady[reqId].mine=true;
  audit("DEAL_READY_MARKED",{requirementId:reqId,side:"mine"});save();render();
}
function showProfile(){state.page="profile";render();}
function renderProfile(){
  const p=state.profile;
  document.getElementById("app").innerHTML=`
  <div class="dashboard-head"><div><div class="eyebrow">Account</div><h1>Profile</h1></div><button class="btn" onclick="showPage('home')">← Home</button></div>
  <section class="panel"><div class="grid">
    <div><label>Name</label><input value="${esc(p.name)}" disabled></div>
    <div><label>Mobile</label><input value="${esc(p.mobile)}" disabled></div>
    <div><label>Email</label><input value="${esc(p.email)}" disabled></div>
    <div><label>Country</label><input value="${esc(p.country)}" disabled></div>
    <div class="full"><label>Address</label><textarea disabled>${esc(p.address)}</textarea></div>
  </div><div class="note">Your personal details are stored only as local prototype data in this browser. A production version must use a secure backend and proper authentication.</div></section>`;
}
function openRegister(){
  document.getElementById("modal").classList.remove("hidden");
  document.getElementById("modalCard").innerHTML=`
  <button class="close" onclick="closeModal()">×</button>
  <div class="eyebrow">Mandatory registration</div><h2>Create your TradeSphere account</h2>
  <p class="muted">Offline prototype: OTP controls are simulated. Real SMS/email OTP needs a backend provider.</p>
  <div class="grid">
    <div><label>Mobile number *</label><input id="regMobile" inputmode="tel" placeholder="+91 98XXXXXXXX"></div>
    <div><label>Email *</label><input id="regEmail" type="email" placeholder="you@example.com"></div>
    <div><label>Full name *</label><input id="regName" placeholder="Your name"></div>
    <div><label>Country *</label>${countryList("regCountry", "India")}</div>
    <div class="full"><label>Address *</label><textarea id="regAddress" placeholder="Your address"></textarea></div>
    <div><label>OTP</label><input id="regOtp" placeholder="Demo OTP: 123456" inputmode="numeric"></div>
    <div><label>&nbsp;</label><button class="btn" onclick="demoOtp()">Send OTP (Demo)</button></div>
  </div>
  <div class="actions"><button class="btn gold" onclick="register()">Verify & Register</button></div>`;
}
function demoOtp(){alert("Demo OTP is 123456. Real OTP will be connected when the backend/SMS provider is added.");document.getElementById("regOtp").value="123456";}
function register(){
  const mobile=document.getElementById("regMobile").value.trim(),email=document.getElementById("regEmail").value.trim(),name=document.getElementById("regName").value.trim(),country=document.getElementById("regCountry").value.trim(),address=document.getElementById("regAddress").value.trim(),otp=document.getElementById("regOtp").value.trim();
  if(!mobile||!email||!name||!country||!address){alert("Please fill all required fields.");return;}
  if(otp!=="123456"){alert("For this offline prototype, enter demo OTP 123456.");return;}
  state.profile={id:"u-"+id(),mobile,email,name,country,address,registeredAt:new Date().toISOString()};
  audit("REGISTRATION_COMPLETED",{userId:state.profile.id});save();closeModal();state.page="home";render();
}
function closeModal(){document.getElementById("modal").classList.add("hidden");}
function logout(){
  if(confirm("Logout from this prototype? Your saved registration and trade demo data will remain in this browser.")){
    state.profile=null;state.page="home";render();
  }
}
safeLoad();
render();
</script>
</body>
</html>
